name: Update profile card

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  push:
    branches: [main]
    paths: ["generate.py", "assets/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Generate SVGs
        env:
          # Add a PROFILE_TOKEN secret (classic PAT, scopes: repo, read:user) to count
          # private repos and commits; otherwise only public activity is counted.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Update profile card"
          git push
